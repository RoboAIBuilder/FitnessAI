[project]
name = "fitnessai-api"
version = "0.3.0"
description = "FitnessAI API: clients, circuit sessions, packages, plans and event-driven scheduling"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.2",
  "uvicorn[standard]==0.31.1",
  "sqlmodel==0.0.22",
  "alembic==1.13.3",
  "pydantic==2.9.2",
  "pyjwt[crypto]==2.9.0",
  "pywebpush==2.0.3",
  "psycopg[binary]==3.2.3",
  "tzdata==2024.2",
]

# Vercel runs the FastAPI app from this module (the code lives in the app/ package).
[tool.vercel]
entrypoint = "app.main:app"
